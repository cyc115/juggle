# ⚠️ DECOMMISSIONED ON THE MAC (2026-07-22): the shared Hindsight instance was migrated
# to the homelab services VM (10.0.0.11:8888), where it now runs as a rootless Podman
# Quadlet (homelab repo: containers/hindsight/, ansible/hindsight.yml). Juggle reaches it
# via ~/.juggle/config.json (hindsight.api_url = http://10.0.0.11:8888). This compose is
# retained ONLY as a rollback fallback — do NOT `docker compose up` while the VM instance
# is live: it is a single shared memory bank and running both splits it. Rollback: set
# config.json api_url back to http://localhost:18888 and `docker start juggle-hindsight`.
services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: juggle-hindsight
    restart: unless-stopped
    ports:
      - "127.0.0.1:18888:8888"
      - "127.0.0.1:19999:9999"
    volumes:
      - "${JUGGLE_DATA_DIR:-${HOME}/.juggle}/memory/pg0:/home/hindsight/.pg0"
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_LLM_PROVIDER:-openai}
      - HINDSIGHT_API_LLM_BASE_URL=${HINDSIGHT_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - HINDSIGHT_API_LLM_API_KEY=${OPENROUTER_KEY}
      - HINDSIGHT_API_LLM_MODEL=${HINDSIGHT_LLM_MODEL:-@preset/hidsight-routing}
      - HINDSIGHT_API_TENANT_API_KEY=juggle
      - HINDSIGHT_API_TENANT_KEY_MAP=juggle:juggle
      - HINDSIGHT_API_RERANKER_PROVIDER=litellm-sdk
      - HINDSIGHT_API_RERANKER_LITELLM_SDK_MODEL=voyage/rerank-2.5
      - HINDSIGHT_API_RERANKER_LITELLM_SDK_API_KEY=${VOYAGE_API_KEY}
    mem_limit: 4g
